<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live - Anchor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='square'><circle cx='12' cy='5' r='2.5'/><path d='M12 7.5V21M4 13c0 5 3.6 8 8 8s8-3 8-8M8 11h8'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h2 id="page-heading">Live now</h2>
    <div class="grid" id="grid"></div>
  </main>
  <script src="/common.js"></script>
  <script>
    async function load() {
      const grid = document.getElementById('grid');
      try {
        const { streams } = await api('/api/live');
        grid.innerHTML = streams.map(liveCard).join('')
          || `<div class="empty">Nobody is live right now.<br><br>
              <button class="primary" onclick="location.href='/studio'">Go live yourself</button></div>`;
      } catch (e) {
        grid.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
      }
    }
    document.addEventListener('auth-ready', () => {
      load();
      setInterval(load, 30000);
    }, { once: true });
  </script>
</body>
</html>
