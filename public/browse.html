<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse - Anchor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='square'><circle cx='12' cy='5' r='2.5'/><path d='M12 7.5V21M4 13c0 5 3.6 8 8 8s8-3 8-8M8 11h8'/></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="chip-bar" id="chip-bar"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
  <script src="/common.js"></script>
  <script>
    const category = new URLSearchParams(location.search).get('category') || '';

    (async () => {
      const { categories } = await api('/api/categories');
      document.getElementById('chip-bar').innerHTML =
        `<a class="chip ${category ? '' : 'active'}" href="/browse">All</a>` +
        categories.map(c =>
          `<a class="chip ${c.name === category ? 'active' : ''}" href="/browse?category=${encodeURIComponent(c.name)}">${esc(c.name)} <span class="n">${c.count}</span></a>`
        ).join('');

      if (category) document.title = `${category} - Anchor`;
      mountFeed(cursor => {
        const params = new URLSearchParams();
        if (category) params.set('category', category);
        if (cursor) params.set('cursor', cursor);
        const qs = params.toString();
        return api('/api/videos' + (qs ? `?${qs}` : ''));
      }, { emptyMsg: category ? `No videos in ${category} yet.` : 'No videos yet.' });
    })();
  </script>
</body>
</html>
