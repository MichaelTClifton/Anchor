<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>&#9875;</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div id="results-heading"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>
  <script src="/common.js"></script>
  <script>
    (async () => {
      const q = new URLSearchParams(location.search).get('q');
      const { videos } = await api('/api/videos' + (q ? `?q=${encodeURIComponent(q)}` : ''));
      if (q) {
        document.getElementById('results-heading').innerHTML =
          `<h2>Results for &ldquo;${esc(q)}&rdquo;</h2>`;
        document.title = `${q} - Anchor`;
      }
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      if (!videos.length) {
        empty.hidden = false;
        empty.textContent = q
          ? 'No videos matched your search.'
          : 'No videos yet. Be the first to upload one!';
        return;
      }
      grid.innerHTML = videos.map(v => videoCard(v)).join('');
    })();
  </script>
</body>
</html>
